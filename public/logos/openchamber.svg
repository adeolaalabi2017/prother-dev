    <path d="M0 0 L-26 -15 L-26 15 L0 30 Z" fill="#FFFFFF" fill-opacity="0.25" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
    <!-- Right face - with fill -->
