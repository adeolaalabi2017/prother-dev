<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <rect width="32" height="32" rx="6" fill="#0D0E12"/>
  <g transform="translate(16, 16) scale(0.46)" color="#FFFFFF">
