# CI/CD — verify on every push/PR; deploy backend then frontend on main.
#
# Lint scope note: `eslint .` is not gated here because
# src/components/prother/* carries pre-existing hook-rule debt in files
# unrelated to the Convex migration (fails identically at the migration
# base). The gated paths below are clean; widen the scope once that debt
# is paid down.
#
# Deploy order matters: the worker build bakes NEXT_PUBLIC_CONVEX_URL and
# must never ship against a failed backend push, so deploy-convex runs
# first and deploy-worker needs them both green (plus verify).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        # prisma/* seeds and scripts/export-to-convex.ts import the generated
        # client, which is not committed — generate it from prisma/schema.prisma.
        run: bunx prisma generate

      - name: Lint (gated paths)
        run: bunx eslint src/app src/lib convex scripts

      - name: Typecheck
        run: bunx tsc --noEmit -p tsconfig.json

      - name: Production build
        run: bun run build

  deploy-convex:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy Convex functions
        run: bunx convex deploy --yes
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

  deploy-worker:
    needs: [verify, deploy-convex]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and deploy to Cloudflare Workers
        # NEXT_PUBLIC_* bake into client JS at build time; runtime secrets
        # (ADMIN_KEY, NEXTAUTH_*, RESEND_*, GOOGLE_*) live in wrangler secrets.
        run: |
          NEXT_OUTPUT=cloudflare \
          NEXT_PUBLIC_CONVEX_URL='${{ secrets.NEXT_PUBLIC_CONVEX_URL }}' \
          NEXT_PUBLIC_SITE_URL='https://prother.dev' \
          bunx opennextjs-cloudflare build
          bunx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
