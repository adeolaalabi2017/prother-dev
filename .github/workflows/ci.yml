# CI — lint, typecheck, and production build on every push / PR to main.
#
# Lint scope note: `eslint .` is not gated here because
# src/components/prother/* carries pre-existing hook-rule debt in files
# unrelated to the Convex migration (fails identically at the migration
# base). The gated paths below are clean; widen the scope once that debt
# is paid down.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        # prisma/* seeds and scripts/export-to-convex.ts import the generated
        # client, which is not committed — generate it from prisma/schema.prisma.
        run: bunx prisma generate

      - name: Lint (gated paths)
        run: bunx eslint src/app src/lib convex scripts

      - name: Typecheck
        run: bunx tsc --noEmit -p tsconfig.json

      - name: Production build
        run: bun run build
